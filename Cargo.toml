[workspace]
members = [
    "crates/nimino-relay",
    "crates/nimino-core",
    "crates/nimino-conformance",
    "crates/nimino-db",
    "crates/nimino-local-delivery",
    "crates/nimino-auth",
    "crates/nimino-search",
    "crates/nimino-audit",
    "crates/nimino-acp",
    "crates/nimino-agent",
    "crates/nimino-test-client",
    "crates/nimino-ws-client",
    "crates/nimino-admin",
    "crates/nimino-deletion",
    "crates/nimino-workflow",
    "crates/nimino-media",
    "crates/nimino-cli",
    "crates/nimino-pairing-cli",
    "crates/nimino-sdk",
    "crates/nimino-persona",
    "crates/git-credential-nostr",
    "crates/git-sign-nostr",
    "crates/nimino-pair-relay",
    "crates/nimino-dev-mcp",
    "crates/nimino-voice",
    "crates/nimino-backend-kubernetes",
    "crates/nimino-datastore-tracing",
    "crates/nimino-boundary",
    "crates/nimino-chirps",
    "crates/nimino-sync",
    "crates/nimino-control",
    "crates/nimino-store",
    "crates/nimino-object-store",
    "crates/nimino-data-ops",
    "crates/nimino-wsl-launcher",
    "examples/countdown-bot",
]
exclude = ["desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/asopitech-labs/nimino"

[workspace.dependencies]
# Runtime
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
tokio-util  = { version = "0.7", features = ["rt", "codec"] }

# HTTP + WebSocket
axum        = { version = "0.8", features = ["ws", "macros"] }
tower       = { version = "0.5", features = ["timeout", "util", "limit"] }
tower-http  = { version = "0.6", features = ["trace", "cors", "compression-gzip", "limit", "timeout", "fs"] }

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"
] }
redb = "=3.1.3"

# Kubernetes (nimino-backend-kubernetes provider). No `ring` feature here: the
# process-level CryptoProvider is installed explicitly at startup, matching
# nimino-cli/nimino-acp/nimino-admin/nimino-relay/nimino-dev-mcp — see the comment on the
# crate's own rustls dependency.
kube = { version = "2.0", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.26", features = ["v1_31"] }

# Nostr
nostr = { version = "0.44", features = ["nip44", "nip98"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
# Cluster negotiation/membership/secure messaging. Only nimino-chirps may use
# this dependency directly; product/data/consensus policy remains Nim-owned.
alopex-chirps = { version = "=0.6.3", default-features = false }
serde_json  = "1"
serde_yaml  = "0.9"
evalexpr    = "11"
cron        = "0.16"
# Observability
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry       = { version = "0.33" }
opentelemetry               = { version = "0.32", features = ["trace"] }
opentelemetry_sdk           = { version = "0.32", features = ["trace", "rt-tokio"] }
opentelemetry-otlp          = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "tls-ring"] }
metrics             = "0.24"
metrics-exporter-prometheus = "0.18"
metrics-util        = "0.20"

# Error handling
thiserror = "2"
anyhow    = "1"

# Utilities
uuid    = { version = "1", features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }

# HTTP client (webhook delivery)
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# Cryptography
sha2      = "0.11"
hex       = "0.4"
hmac      = "0.13"
base64    = "0.22"

# Randomness
rand = "0.10"
subtle = "2.6"
zeroize = "1.8"

# Concurrent data structures
dashmap = "6"
moka    = { version = "0.12", features = ["sync"] }

# Async stream utilities
futures-util = "0.3"

# WebSocket client (test client)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"

# Property-based testing (dev-only)
proptest = "1"

# MCP SDK (used by nimino-dev-mcp and nimino-agent)
rmcp = { version = "1.1.0", features = ["server", "transport-io", "macros"] }
schemars = { version = "1", default-features = false }

# Internal crates
nimino-core = { path = "crates/nimino-core" }
nimino-conformance = { path = "crates/nimino-conformance" }
nimino-db = { path = "crates/nimino-db" }
nimino-deletion = { path = "crates/nimino-deletion" }
nimino-auth = { path = "crates/nimino-auth" }
nimino-local-delivery = { path = "crates/nimino-local-delivery" }
nimino-search = { path = "crates/nimino-search" }
nimino-audit = { path = "crates/nimino-audit" }
nimino-workflow = { path = "crates/nimino-workflow" }
nimino-media = { path = "crates/nimino-media" }
nimino-sdk = { path = "crates/nimino-sdk" }
nimino-ws-client = { path = "crates/nimino-ws-client" }
nimino-datastore-tracing = { path = "crates/nimino-datastore-tracing" }

# CI profile — builds the relay for desktop e2e. Dependencies keep full
# release optimization (warm from main's cache; they carry the runtime hot
# path: tokio/sqlx/axum). Workspace crates build at opt-level 1 — enough for
# stable e2e timing (PR #307 flakiness was opt-0 + debug-assertions) at
# roughly half the codegen cost. Incremental stays disabled: rust-cache exports
# CARGO_INCREMENTAL=0, and the CI compiler cache requires non-incremental units.
[profile.ci]
inherits = "release"
lto = false
opt-level = 1

[profile.ci.package."*"]
opt-level = 3
