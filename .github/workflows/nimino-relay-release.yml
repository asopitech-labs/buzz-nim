name: Nimino relay candidate

on:
  workflow_call:
  pull_request:
    paths:
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "nim/**"
      - "web/**"
      - "admin-web/**"
      - "deploy/charts/nimino/**"
      - "deploy/compose/**"
      - "contracts/nimino-relay-release/**"
      - "contracts/nimino-object-sync/**"
      - "contracts/nimino-release-set/**"
      - "scripts/nimino-release-set.mjs"
      - "scripts/test-nimino-relay-release-contract.mjs"
      - ".github/workflows/nimino-relay-release.yml"

concurrency:
  group: nimino-relay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CANONICAL_REPOSITORY: asopitech-labs/nimino
  IMAGE_NAME: ghcr.io/asopitech-labs/nimino
  CHART_REPO: oci://ghcr.io/asopitech-labs/nimino/charts

jobs:
  source:
    name: Source, chart, and Compose contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Reject publication from a non-canonical repository
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
      - run: just relay-release-contract
      - name: Render Compose with a digest-pinned candidate
        env:
          NIMINO_IMAGE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_PASSWORD: contract-postgres
          NIMINO_S3_ACCESS_KEY: contract-access
          NIMINO_S3_SECRET_KEY: contract-secret-key
        run: docker compose -f deploy/compose/compose.yml config --quiet
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4
      - run: helm dependency build deploy/charts/nimino
      - run: helm lint deploy/charts/nimino
      - run: helm template nimino deploy/charts/nimino -f deploy/charts/nimino/ci/quickstart-values.yaml >/dev/null

  evidence:
    name: Three-node negotiation and convergence evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: Swatinem/rust-cache@779b2ca901a859ea0906cf43be8d33c3f22f8134 # v2.8.2
      - name: Real Chirps scenario evidence
        run: just nimino-cluster-scenarios output=target/nim/nimino-cluster-scenarios.json
      - name: Real Chirps data synchronization evidence
        run: just nimino-sync-scenarios output=target/nim/nimino-sync-scenarios.json
      - name: Content-addressed object replication evidence
        run: |
          set -o pipefail
          just nimino-object-scenarios 2>&1 | tee target/nim/nimino-object-scenarios.log
      - name: Projection drop and rebuild evidence
        run: |
          set -o pipefail
          just nimino-projection-scenarios 2>&1 | tee target/nim/nimino-projection-scenarios.log
      - name: Data convergence and repair evidence
        run: |
          set -o pipefail
          just nimino-data-ops-scenarios 2>&1 | tee target/nim/nimino-data-ops-scenarios.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-release-evidence
          path: |
            target/nim/nimino-cluster-scenarios.json
            target/nim/nimino-sync-scenarios.json
            target/nim/nimino-object-scenarios.log
            target/nim/nimino-projection-scenarios.log
            target/nim/nimino-data-ops-scenarios.log
          if-no-files-found: error

  image:
    name: Native image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: source
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref_type == 'tag' }}
          cache-from: type=gha,scope=nimino-relay-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nimino-relay-${{ matrix.arch }}
      - name: Record immutable digest
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digest
          touch "digest/${DIGEST#sha256:}"
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-image-digest-${{ matrix.arch }}
          path: digest/*
          if-no-files-found: error

  assemble:
    name: Clean install, sign, and stage candidate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: [source, evidence, image]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: relay-image-digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: relay-release-evidence
          path: evidence
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Assemble candidate manifest
        id: image
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#nimino-v}"
          scripts/verify-release-ref.sh nimino-v "$VERSION"
          refs=()
          for digest in digests/*; do refs+=("${IMAGE_NAME}@sha256:$(basename "$digest")"); done
          docker buildx imagetools create -t "${IMAGE_NAME}:candidate-${GITHUB_SHA}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:candidate-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          version: v0.24.0
          node_image: kindest/node:v1.31.0
      - name: Clean cluster install and readiness
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker tag "${IMAGE_NAME}@${IMAGE_DIGEST}" "${IMAGE_NAME}:candidate-${GITHUB_SHA}"
          kind load docker-image "${IMAGE_NAME}:candidate-${GITHUB_SHA}"
          kubectl create namespace nimino-system
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=nimino-chirps' \
            -keyout /tmp/chirps-key.pem -out /tmp/chirps-cert.pem
          openssl x509 -in /tmp/chirps-cert.pem -outform DER -out /tmp/tls.crt
          openssl pkcs8 -topk8 -nocrypt -in /tmp/chirps-key.pem -outform DER -out /tmp/tls.key
          cp /tmp/tls.crt /tmp/ca.crt
          kubectl -n nimino-system create secret generic nimino-chirps \
            --from-file=tls.crt=/tmp/tls.crt --from-file=tls.key=/tmp/tls.key --from-file=ca.crt=/tmp/ca.crt
          helm dependency build deploy/charts/nimino
          helm upgrade --install nimino deploy/charts/nimino \
            --namespace nimino-system \
            -f deploy/charts/nimino/ci/quickstart-values.yaml \
            --set image.repository="${IMAGE_NAME}" \
            --set image.tag="candidate-${GITHUB_SHA}" \
            --set image.pullPolicy=IfNotPresent \
            --set replicaCount=3 \
            --wait --timeout 10m
          kubectl -n nimino-system rollout status statefulset/nimino --timeout=2m
      - name: Package and sign immutable artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.image.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker buildx imagetools create -t "${IMAGE_NAME}:${VERSION}" "${IMAGE_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
          helm package deploy/charts/nimino --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/nimino-${VERSION}.tgz" "$CHART_REPO"
          chart_ref="ghcr.io/asopitech-labs/nimino/charts/nimino:${VERSION}"
          chart_digest="$(docker buildx imagetools inspect "$chart_ref" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "${chart_ref%@*}@${chart_digest}"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "dist/nimino-compose-${VERSION}.tar.gz" deploy/compose
          printf '%s\n' "$IMAGE_DIGEST" > dist/nimino-relay-image.digest
          cp evidence/nimino-cluster-scenarios.json dist/
          cp evidence/nimino-sync-scenarios.json dist/
          cp evidence/nimino-object-scenarios.log dist/
          cp evidence/nimino-projection-scenarios.log dist/
          cp evidence/nimino-data-ops-scenarios.log dist/
          cosign sign-blob --yes --bundle dist/nimino-chart.sigstore.json "dist/nimino-${VERSION}.tgz"
          cosign sign-blob --yes --bundle dist/nimino-compose.sigstore.json "dist/nimino-compose-${VERSION}.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nimino-relay-candidate
          path: dist/*
          if-no-files-found: error
