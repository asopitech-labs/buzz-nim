services:
  relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      NIMINO_DOMAIN: ${NIMINO_DOMAIN:?set NIMINO_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nimino-caddy-data:/data
      - nimino-caddy-config:/config
    restart: unless-stopped
    networks:
      - nimino-net

volumes:
  nimino-caddy-data:
    labels:
      com.nimino.volume: caddy-data
  nimino-caddy-config:
    labels:
      com.nimino.volume: caddy-config
