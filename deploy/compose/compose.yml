name: nimino-prod

services:
  relay:
    image: ghcr.io/asopitech-labs/nimino@${NIMINO_IMAGE_DIGEST:?set NIMINO_IMAGE_DIGEST to sha256:<digest>}
    env_file:
      - .env
    environment:
      NIMINO_BIND_ADDR: 0.0.0.0:3000
      NIMINO_HEALTH_PORT: "8080"
      NIMINO_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-nimino}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nimino}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      NIMINO_S3_ENDPOINT: http://minio:9000
      # Docker DNS resolves `minio`, not arbitrary `<bucket>.minio` hosts.
      NIMINO_S3_ADDRESSING_STYLE: path
      NIMINO_S3_ACCESS_KEY: ${NIMINO_S3_ACCESS_KEY:?set NIMINO_S3_ACCESS_KEY}
      NIMINO_S3_SECRET_KEY: ${NIMINO_S3_SECRET_KEY:?set NIMINO_S3_SECRET_KEY}
      NIMINO_S3_BUCKET: ${NIMINO_S3_BUCKET:-nimino-media}
      NIMINO_GIT_REPO_PATH: /data/git
      NIMINO_AUTO_MIGRATE: ${NIMINO_AUTO_MIGRATE:-false}
      NIMINO_GIT_CONFORMANCE_PROBE: ${NIMINO_GIT_CONFORMANCE_PROBE:-true}
    ports:
      - "${NIMINO_HTTP_PORT:-3000}:3000"
    volumes:
      - nimino-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no curl/wget/socat.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - nimino-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nimino}
      POSTGRES_USER: ${POSTGRES_USER:-nimino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nimino-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - nimino-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - nimino-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - nimino-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NIMINO_S3_ACCESS_KEY:?set NIMINO_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${NIMINO_S3_SECRET_KEY:?set NIMINO_S3_SECRET_KEY}
    volumes:
      - nimino-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - nimino-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      NIMINO_S3_ACCESS_KEY: ${NIMINO_S3_ACCESS_KEY:?set NIMINO_S3_ACCESS_KEY}
      NIMINO_S3_SECRET_KEY: ${NIMINO_S3_SECRET_KEY:?set NIMINO_S3_SECRET_KEY}
      NIMINO_S3_BUCKET: ${NIMINO_S3_BUCKET:-nimino-media}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${NIMINO_S3_ACCESS_KEY}" "$${NIMINO_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${NIMINO_S3_BUCKET}"
        mc anonymous set none "local/$${NIMINO_S3_BUCKET}"
      '
    restart: "no"
    networks:
      - nimino-net

volumes:
  nimino-postgres-data:
    labels:
      com.nimino.volume: postgres
  nimino-redis-data:
    labels:
      com.nimino.volume: redis
  nimino-minio-data:
    labels:
      com.nimino.volume: minio
  nimino-git-data:
    labels:
      com.nimino.volume: git

networks:
  nimino-net:
    driver: bridge
    labels:
      com.nimino.network: production
