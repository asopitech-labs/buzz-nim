# Production / GitOps shape: external services, existingSecret. Renders only;
# `ct install` is not asked to satisfy the external services.
relayUrl: wss://nimino.example.com
ownerPubkey: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
secrets:
  existingSecret: nimino-secrets
externalPostgresql:
  url: "postgres://nimino:pw@postgres.example.com:5432/nimino"
s3:
  endpoint: "https://s3.us-east-1.amazonaws.com"
  bucket: "nimino-media"
persistence:
  git:
    size: 50Gi
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
podDisruptionBudget:
  enabled: false
