# Sample Secret matching `secrets.existingSecret: nimino-secrets`.
#
# Manage this via SealedSecrets / SOPS / External Secrets / Vault — anything
# that keeps the unencrypted form out of git. The chart reads keys it finds
# and leaves the rest as Pod env vars marked `optional: true`.
#
# Keys consumed by the relay (all optional unless required by relay config):
#   NIMINO_RELAY_PRIVATE_KEY        — 64-char hex; relay identity (do NOT rotate)
#   NIMINO_GIT_HOOK_HMAC_SECRET     — 32+ chars; required when replicaCount > 1
#   DATABASE_URL                  — postgres://...
#   READ_DATABASE_URL             — postgres://... (optional read-replica; omit to disable read routing)
#   NIMINO_S3_ACCESS_KEY
#   NIMINO_S3_SECRET_KEY
apiVersion: v1
kind: Secret
metadata:
  name: nimino-secrets
  namespace: nimino
type: Opaque
stringData:
  NIMINO_RELAY_PRIVATE_KEY: "REPLACE_WITH_64_HEX"
  NIMINO_GIT_HOOK_HMAC_SECRET: "REPLACE_WITH_RANDOM_64_CHARS"
  DATABASE_URL: "postgres://nimino:REPLACE@postgres.nimino.svc.cluster.local:5432/nimino?sslmode=require"
  NIMINO_S3_ACCESS_KEY: "REPLACE"
  NIMINO_S3_SECRET_KEY: "REPLACE"
