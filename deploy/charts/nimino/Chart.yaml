apiVersion: v2
name: nimino
description: |
  Nimino — a Nostr-based messaging platform for human–agent collaboration.

  A single relay binary serving WebSocket + REST + web UI, backed by
  PostgreSQL and S3-compatible object storage. Configurable for evaluation
  (subcharts on) and HA production (external services, existingSecret).
type: application
version: 0.1.7
appVersion: "0.1.0"
home: https://github.com/asopitech-labs/nimino
sources:
  - https://github.com/asopitech-labs/nimino
keywords:
  - nostr
  - relay
  - messaging
  - websocket
  - chat
maintainers:
  - name: AsopiTech Labs
    url: https://github.com/asopitech-labs
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Generic init-container, volume, volume-mount, command, and args extension points for the relay Pod.
  artifacthub.io/license: Apache-2.0

# Optional eval-only subchart. Production points externalPostgresql (or
# secrets.existingSecret) at a managed service.
dependencies:
  - name: postgres
    version: "0.19.x"
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgresql.enabled
    alias: postgresql
